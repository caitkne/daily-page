<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="seed.js"></script>
</head><body>
<title>The Daily Page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: the Build Log family. A pseudo-early-tech terminal: one flat background, one text colour,
   your typing starts with ">", [bracket] buttons, highlight blocks invert the two colours.
   The deck reads top to bottom like a session transcript. Single look on purpose. */
:root{
  color-scheme:dark;
  --bg:#1d3aa6; --fg:#fff23a;
  --hi:var(--fg); --hi-fg:var(--bg);
  --dim:color-mix(in srgb,var(--fg) 74%,var(--bg));
  --rule:color-mix(in srgb,var(--fg) 30%,var(--bg));
  --press:color-mix(in srgb,var(--fg) 14%,var(--bg));
  --f:"IBM Plex Mono","Courier New",ui-monospace,monospace;
}
html[data-pal=shoujo]{--bg:#ff4fae;--fg:#14206e}
html[data-pal=stripe]{--bg:#7cd629;--fg:#14206e}
html[data-pal=poster]{--bg:#0f5a2e;--fg:#e9f542}
html[data-pal=mod]{--bg:#ff5a1f;--fg:#2b2405}
html[data-pal=tambourine]{--bg:#fff23a;--fg:#1d3aa6}
html[data-pal=bunny]{--bg:#7fc8f8;--fg:#8a0050}
html[data-pal=olive]{--bg:#6b5c1a;--fg:#ffe3f1}
html[data-pal=lilac]{--bg:#d9b8f0;--fg:#1d3aa6}
html[data-pal=night]{--bg:#14206e;--fg:#ff6fbf}
html,body{height:100%}
body{transition:background-color .3s;background:var(--bg);color:var(--fg);font-family:var(--f);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--fg)}
:focus-visible{outline:1px dashed var(--fg);outline-offset:2px}
p{margin:0}

.term{min-height:100%;max-width:640px;margin:0 auto;box-sizing:border-box;padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:6px 12px;flex-wrap:wrap;text-transform:uppercase;letter-spacing:.08em}
.hd b{font-weight:600}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.blk{display:grid;gap:6px}
.rule{border:0;border-top:1px dashed var(--rule);margin:0}
.lbl{text-transform:uppercase;letter-spacing:.1em;color:var(--dim);font-size:14px}
.dim{color:var(--dim)}
.small{font-size:14px}
.wrap{overflow-wrap:anywhere;min-width:0}
.hl{background:var(--hi);color:var(--hi-fg);padding:2px 6px}
.hl .dim{color:inherit;opacity:.8}
.u::before{content:"> "}

.k{display:inline-block;padding:2px 4px;min-height:32px;line-height:28px;white-space:nowrap}
.k::before{content:"["}.k::after{content:"]"}
.k[aria-pressed="true"],.k:active{background:var(--hi);color:var(--hi-fg)}
.k[disabled]{opacity:.45;cursor:not-allowed}
.k.big{font-weight:600}
.opts{display:flex;flex-wrap:wrap;column-gap:4px;row-gap:2px;align-items:center}

/* a labelled row: label column, then the content */
.row{display:grid;grid-template-columns:9ch 1fr;column-gap:10px;align-items:baseline}
.row>.lbl{padding-top:4px}
@media (max-width:420px){.row{grid-template-columns:1fr}.row>.lbl{padding-top:0}}

/* typing line: "> " then the field, flat on the background */
.line{display:flex;align-items:baseline;gap:0;border-bottom:1px dashed var(--rule);min-width:0}
.line::before{content:"> ";white-space:pre;flex:none}
.line input,.line textarea{flex:1;min-width:0;background:transparent;border:0;outline:none;padding:4px 0;caret-color:var(--fg);border-radius:0;-webkit-appearance:none;appearance:none}
.line input::placeholder,.line textarea::placeholder{color:var(--dim);opacity:1}
.line textarea{resize:none;min-height:1.45em;overflow:hidden}
.line.big input{font-size:21px;font-weight:600}
select.sel{background:var(--bg);border:1px dashed var(--rule);border-radius:0;padding:6px 8px;width:100%;max-width:100%;color:var(--fg)}

.meter{font-variant-numeric:tabular-nums;white-space:pre}
.fam{display:grid;grid-template-columns:9ch 1fr;column-gap:10px;align-items:baseline}
.fam .lbl{font-size:13px;padding-top:5px}
@media (max-width:420px){.fam{grid-template-columns:1fr}}

.entry{display:grid;gap:2px;text-align:left;width:100%;padding:4px 0}
.entry:active{background:var(--press)}
.entry .nm::before{content:"> "}
.entry .m{padding-left:2ch;color:var(--dim);font-size:14px}
.trow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.trow .dots{flex:1;border-bottom:1px dotted var(--rule);transform:translateY(-4px);min-width:2ch}
.cnt{font-variant-numeric:tabular-nums}
.flash{background:var(--hi);color:var(--hi-fg);padding:4px 8px}
.flash::before{content:"> "}
.sp{display:inline-block;animation:tw 1.6s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
.caret{display:inline-block;width:.6em;height:1.1em;background:var(--fg);vertical-align:-.15em;animation:blink 1.06s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.title{font-size:24px;font-weight:600;line-height:1.25;text-wrap:balance}
.prompt{font-size:19px;line-height:1.45}
.bit{margin:0 0 18px}.bit .title{margin:0 0 2px}
.shape{display:grid;grid-template-columns:9ch 1fr;column-gap:10px;row-gap:6px}
.shape .t{color:var(--dim);font-variant-numeric:tabular-nums}
@media (max-width:420px){.shape{grid-template-columns:7ch 1fr}}
.hist{display:grid;grid-template-columns:7ch 1fr auto;column-gap:10px;padding:3px 0;align-items:baseline}
.hist .t{color:var(--dim);font-variant-numeric:tabular-nums}
textarea.out{width:100%;box-sizing:border-box;background:transparent;border:1px dashed var(--rule);font-size:13px;height:120px;padding:6px;resize:vertical}
@media (prefers-reduced-motion:reduce){.caret,.sp{animation:none}body{transition:none}}
.card{display:grid;grid-template-columns:7ch 1fr;column-gap:10px;row-gap:2px;align-items:baseline}
.card .lbl{padding-top:4px}
.card .title{grid-column:2}
.card .src{grid-column:2;color:var(--dim);font-size:14px}
.card .body{grid-column:2;margin:2px 0 4px}
.card .src a{color:inherit}
@media (max-width:420px){.card{grid-template-columns:1fr}.card .title,.card .src,.card .body{grid-column:1}}
.date{font-size:15px;letter-spacing:.12em;text-transform:uppercase}
.note{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:3px 0}
</style>

<div class="term" id="term"></div>
<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const term=$('#term');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const rand=a=>a[Math.floor(Math.random()*a.length)];
const pad2=n=>String(n).padStart(2,'0');
const dkey=d=>{const x=new Date(d);return x.getFullYear()+'-'+pad2(x.getMonth()+1)+'-'+pad2(x.getDate())};
const today=()=>dkey(Date.now());
const daysAgo=k=>Math.round((new Date(today()+'T12:00')-new Date(k+'T12:00'))/864e5);
const niceDay=k=>new Date(k+'T12:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'}).toLowerCase();
const longDay=k=>new Date(k+'T12:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'});

/* colours: the same palettes as Build Log, one tap to step through them */
const PALS=['manga','shoujo','stripe','poster','mod','tambourine','bunny','olive','lilac','night'];
let pal='manga'; try{pal=localStorage.getItem('briefdeck.pal')||'manga'}catch(e){}
if(!PALS.includes(pal)) pal='manga';
const setPal=p=>{pal=p;document.documentElement.dataset.pal=p;try{localStorage.setItem('briefdeck.pal',p)}catch(e){}};
setPal(pal);

/* where the morning fetcher saves each day's found cards (a GitHub repository, served by jsDelivr) */
const FOUND_BASE='found/';
const KEPT_REST=60;   // days before the same kept thing can come back
const RETIRE_AT=3;    // a way rated "meh" this many times is retired

let S={items:[],hist:{},tab:'today',loaded:false,flash:'',localOnly:false,found:{},fresh:{},foundState:{},notes:['','',''],armRedraw:false,editing:null,oldOpen:null};

/* ---------- storage: the page's own store; this device only if that is unavailable ---------- */
let DB=null;
const LKEY='dailypage.local';
function saveLocal(){if(DB) return; try{localStorage.setItem(LKEY,JSON.stringify({items:S.items,hist:S.hist,seedV:S.seedV||0}))}catch(e){}}
function loadLocal(){try{const d=JSON.parse(localStorage.getItem(LKEY)||'null'); if(d){S.items=d.items||[]; S.hist=d.hist||{}; S.seedV=d.seedV||0}}catch(e){}}
async function putItem(it){
  const i=S.items.findIndex(x=>x.id===it.id); if(i>=0) S.items[i]=it; else S.items.push(it);
  if(DB){try{const o=Object.assign({},it);delete o.id;await DB.doc('items/'+it.id).set(o)}catch(e){say("couldn't save. check your connection.")}} else saveLocal();
}
async function dropItem(id){
  S.items=S.items.filter(x=>x.id!==id);
  if(DB){try{await DB.doc('items/'+id).delete()}catch(e){say("couldn't delete. try again.")}} else saveLocal();
}
async function putHist(k){
  const h=S.hist[k];
  if(DB){try{await DB.doc('history/'+k).set(h)}catch(e){say("couldn't save today's page.")}} else saveLocal();
}
async function connect(){
  loadLocal();
  if(window.SEED){
    if(!S.items.length){S.items=SEED.items.map(x=>Object.assign({},x));S.hist=Object.assign({},SEED.hist);S.seedV=SEED.version||1;saveLocal()}
    else if((S.seedV||1)<(SEED.version||1)){
      const starter=/^w(0[1-9]|10)$/; S.items=S.items.filter(x=>!(x.list==='way'&&starter.test(x.id)&&!x.updated));
      const have=new Set(S.items.map(x=>x.id)); SEED.items.forEach(x=>{if(!have.has(x.id)) S.items.push(Object.assign({},x))});
      S.seedV=SEED.version; saveLocal();
    }
  }
  S.loaded=true;S.localOnly=true;render();
}
function fallback(){DB=null;loadLocal();S.loaded=true;S.localOnly=true;render()}
function soft(){const a=document.activeElement; if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')&&a.value){render(true);return} render()}

/* ---------- found cards: loaded from the morning fetcher's file for a date ---------- */
function loadFound(k){
  if(S.foundState[k]) return;
  S.foundState[k]='loading';
  if(DB){
    DB.doc('found/'+k).get().then(d=>{
      const v=d&&d.exists!==false&&d.data?d.data():null;
      if(v&&Array.isArray(v.cards)&&v.cards.length){S.found[k]=v.cards;S.foundState[k]='ok';render(true)} else loadFoundFile(k);
    }).catch(()=>loadFoundFile(k));
  } else loadFoundFile(k);
}
function loadFoundFile(k){
  const s=document.createElement('script');
  s.src=FOUND_BASE+k+'.js?v='+Math.floor(Date.now()/6e5);
  s.onload=()=>{const d=window.DAILY_FOUND; if(d&&d.date===k&&Array.isArray(d.cards)&&d.cards.length){S.found[k]=d.cards;S.fresh[k]=Array.isArray(d.ways)?d.ways:[];S.foundState[k]='ok'} else S.foundState[k]='none'; delete window.DAILY_FOUND; render(true)};
  s.onerror=()=>{S.foundState[k]='none'; render(true)};
  document.head.appendChild(s);
  setTimeout(()=>{if(S.foundState[k]==='loading'){S.foundState[k]='none';render(true)}},9000);
}
const yesterday=()=>dkey(Date.now()-864e5);
function foundPool(){
  const k=today(), y=yesterday();
  if(S.foundState[k]==='ok') return S.found[k];
  if(S.foundState[k]==='none'&&S.foundState[y]==='ok') return S.found[y];
  return null;
}
const foundWaiting=()=>{const k=today(),y=yesterday(); return S.foundState[k]==='loading'||(S.foundState[k]==='none'&&S.foundState[y]==='loading')||!S.foundState[k]};

/* ---------- the deck ---------- */
const of=list=>S.items.filter(x=>x.list===list);
const bitsOf=a=>(a.bits||[]).filter(Boolean);
function keptPool(){
  const pool=[];
  of('anchor').forEach(a=>bitsOf(a).forEach(b=>pool.push({kind:'bit',a:a.id,text:b})));
  of('note').forEach(n=>pool.push({kind:'note',id:n.id,text:n.text}));
  return pool;
}
function recentKept(skip){
  const u=new Set();
  Object.entries(S.hist).forEach(([d,h])=>{if(d!==skip&&daysAgo(d)>=0&&daysAgo(d)<KEPT_REST&&h.kept) u.add(h.kept.text)});
  return u;
}
/* noticings are your own words, so they come up about half the time once there are some */
function pickKept(k,avoid){
  const used=recentKept(k), all=keptPool().filter(x=>!used.has(x.text)&&x.text!==avoid);
  const pool=all.length?all:keptPool();
  const notes=pool.filter(x=>x.kind==='note'), bits=pool.filter(x=>x.kind==='bit');
  if(notes.length&&(!bits.length||Math.random()<0.5)) return rand(notes);
  return bits.length?rand(bits):null;
}
const mehs=id=>Object.values(S.hist).filter(h=>h.way===id&&h.rating===1).length;
const retired=w=>!w.keep&&mehs(w.id)>=RETIRE_AT;
const liveWays=()=>of('way').filter(w=>!retired(w));
function freshWays(){
  const k=today(), y=yesterday(), d=S.foundState[k]==='ok'?k:(S.foundState[y]==='ok'?y:null);
  return d?(S.fresh[d]||[]).map((w,i)=>Object.assign({},w,{id:'f:'+d+':'+i,fresh:true})):[];
}
function wayOf(h){return h&&(S.items.find(x=>x.id===h.way)||(h.wayObj&&h.wayObj.id===h.way?h.wayObj:null))}
function setWay(h,id){h.way=id; const f=freshWays().find(x=>x.id===id); if(f) h.wayObj=f; else delete h.wayObj}
function pickWay(k,avoid){
  const fr=freshWays().filter(w=>w.id!==avoid);
  if(fr.length&&Math.random()<0.4) return rand(fr).id;
  const recent=new Set(Object.entries(S.hist).filter(([d])=>d!==k&&daysAgo(d)>=0&&daysAgo(d)<4).map(([,h])=>h.way));
  let ws=liveWays().filter(w=>!recent.has(w.id)&&w.id!==avoid);
  if(!ws.length) ws=liveWays().filter(w=>w.id!==avoid);
  if(!ws.length) ws=liveWays();
  const w=rand(ws); return w?w.id:null;
}
function pickFound(avoid){
  const p=foundPool(); if(!p) return null;
  const c=p.filter(x=>x.text!==avoid); const f=rand(c.length?c:p);
  return {text:f.text,whole:f.whole||f.text,source:f.source||'',url:f.url||''};
}
function makePage(k){
  const h={found:pickFound(),kept:pickKept(k),notes:[],rating:0,t:Date.now()}; setWay(h,pickWay(k)); return h;
}

/* a day's page in the new shape (older briefs from before have no kept card) */
const page=k=>{const h=S.hist[k]; return h&&('kept' in h)?h:null};
const nm=id=>{const x=S.items.find(i=>i.id===id);return x?x.name:''};
let flashT=null;
function say(m){S.flash=m;render(true);clearTimeout(flashT);flashT=setTimeout(()=>{S.flash='';render(true)},3500)}

/* ---------- screens ---------- */
function header(){
  const t=(v,l)=>`<button class="k" data-tab="${v}" aria-pressed="${S.tab===v}">${l}</button>`;
  const nKept=keptPool().length;
  return `<div class="hd"><b>THE DAILY PAGE</b><span><button class="k" data-act="pal" aria-label="Change colours">${pal}</button></span><span class="tabs">${t('today','today')}${t('kept','kept')}${t('ways','ways')}</span></div>
  <div class="dim small">${nKept} kept · ${liveWays().length} ways · saved in this browser · <button class="k" data-act="backup">back up</button> <button class="k" data-act="restore">restore</button></div>
  ${S.flash?`<p class="flash wrap">${esc(S.flash)} <span class="sp" aria-hidden="true">✦</span></p>`:''}
  <hr class="rule">`;
}

function cardsHtml(k,h,live){
  const w=wayOf(h);
  const a=h.kept&&h.kept.a?nm(h.kept.a):'';
  const again=(act)=>live?` <button class="k small" data-act="${act}">another</button>`:'';
  const found=h.found?`<p class="title wrap">“${esc(h.found.text)}”</p><p class="src wrap">${h.found.url?`<a href="${esc(h.found.url)}" target="_blank" rel="noopener">${esc(h.found.source)}</a>`:esc(h.found.source)}${again('again-found')}</p>`
    :`<p class="title dim">${live&&foundWaiting()?'fetching…':'no found card'}</p><p class="src">${live&&!foundWaiting()?'today\'s cards haven\'t arrived. take a line from anything printed near you.':''}${live&&foundPool()?again('again-found'):''}</p>`;
  const kept=h.kept?`<p class="title wrap">${esc(h.kept.text)}</p><p class="src">${h.kept.kind==='note'?'noticed by you':'from '+esc(a||'an interest')}${again('again-kept')}</p>`
    :`<p class="title dim">nothing kept yet</p><p class="src">add a noticing on the kept tab.</p>`;
  const way=w?`<p class="title wrap">${esc(w.name)}</p><p class="body wrap">${esc(w.text||'')}</p><p class="src wrap">${w.after?'after '+(w.url?`<a href="${esc(w.url)}" target="_blank" rel="noopener">${esc(w.after)}</a>`:esc(w.after)):''}${live&&w.fresh?' <button class="k small" data-act="keepway">keep this way</button>':''}${again('again-way')}</p>`
    :`<p class="title dim">no ways yet</p><p class="src">add one on the ways tab.</p>`;
  return `<section class="blk">
    <div class="card"><span class="lbl">found</span>${found}</div></section>
  <section class="blk"><div class="card"><span class="lbl">kept</span>${kept}</div></section>
  <section class="blk"><div class="card"><span class="lbl">way</span>${way}</div></section>`;
}

function viewToday(){
  if(!S.loaded) return '<p class="dim">opening… <span class="caret" aria-hidden="true"></span></p>';
  const k=today(), h=page(k);
  loadFound(k); if(S.foundState[k]==='none') loadFound(yesterday());
  if(h&&h.way&&!wayOf(h)){setWay(h,pickWay(k)); setTimeout(()=>putHist(k),0)}
  if(h&&!h.found&&foundPool()){const f=pickFound(); if(f){h.found=f; setTimeout(()=>putHist(k),0)}}
  const past=Object.keys(S.hist).filter(x=>x<k&&S.hist[x].kept!==undefined).sort().reverse().slice(0,14);
  let top;
  if(!h) top=`<section class="blk"><div class="lbl">Today</div><p class="date">${esc(longDay(k))}</p>
      <p>three cards are waiting. <span class="caret" aria-hidden="true"></span></p></section>
    <div><button class="k big" data-act="open" ${foundWaiting()?'disabled':''}>${foundWaiting()?'fetching today\'s cards…':'deal today\'s cards'}</button></div>`;
  else{
    const n=h.notes||[];
    top=`<section class="blk"><div class="lbl">write at the top of the page</div><p class="date">${esc(longDay(k))}</p></section>
    ${cardsHtml(k,h,true)}
    <hr class="rule">
    <section class="blk"><div class="lbl">before you close the page</div><p class="dim small">three things you noticed today. they go into kept.</p>
      ${n.length?n.map(x=>`<p class="u wrap">${esc(x)}</p>`).join('')+'<p class="dim small">saved.</p>':
      [0,1,2].map(i=>`<label class="line"><input id="n-${i}" value="${esc(S.notes[i])}" placeholder="${['a sound','something small','something someone said'][i]}" autocomplete="off" aria-label="Noticing ${i+1}"></label>`).join('')+`<div><button class="k" data-act="notes">save to kept</button></div>`}
    </section>
    <hr class="rule">
    <div class="row"><span class="lbl">how was it</span><span class="opts">${[[1,'meh'],[2,'fine'],[3,'loved it']].map(([v,l])=>`<button class="k" data-act="rate" data-v="${v}" aria-pressed="${h.rating===v}">${v} ${l}</button>`).join('')}</span></div>
    <p class="dim small">"loved it" keeps the found line. a way rated meh ${RETIRE_AT} times is retired.</p>
    <div><button class="k" data-act="redraw">${S.armRedraw?'sure? this deals all three again':'deal again'}</button></div>`;
  }
  return top+(past.length?`<hr class="rule"><section class="blk"><div class="lbl">Past pages</div>${past.map(p=>{const x=S.hist[p];return `<button class="hist entry" data-act="old" data-v="${p}" style="display:grid"><span class="t">${esc(niceDay(p).split(' ').slice(0,2).join(' '))}</span><span class="wrap">${esc([x.found&&x.found.text,x.kept&&x.kept.text].filter(Boolean).join(' / ')||'(older brief)')}</span><span class="dim">${x.rating?'█'.repeat(x.rating)+'░'.repeat(3-x.rating):'···'}</span></button>`}).join('')}</section>`:'')
    +(S.oldOpen&&S.hist[S.oldOpen]?`<hr class="rule"><section class="blk"><p class="date">${esc(longDay(S.oldOpen))}</p></section>${cardsHtml(S.oldOpen,S.hist[S.oldOpen],false)}${(S.hist[S.oldOpen].notes||[]).length?`<section class="blk"><div class="lbl">noticed</div>${S.hist[S.oldOpen].notes.map(x=>`<p class="u wrap">${esc(x)}</p>`).join('')}</section>`:''}<div><button class="k" data-act="old" data-v="">close</button></div>`:'');
}

function viewKept(){
  const notes=of('note').sort((a,b)=>(b.created||0)-(a.created||0));
  const anchors=of('anchor').sort((a,b)=>a.name.localeCompare(b.name));
  const ed=S.editing&&S.items.find(x=>x.id===S.editing);
  return `
  <section class="blk"><div class="lbl">Add a noticing</div>
    <label class="line"><input id="k-new" placeholder="something you saw, heard or kept" autocomplete="off" aria-label="New noticing"></label>
    <div><button class="k" data-act="addnote">keep it</button></div></section>
  <hr class="rule">
  <section class="blk"><div class="lbl">Noticings · ${notes.length}</div>
    ${notes.length?notes.map(n=>`<div class="note"><span class="wrap">${esc(n.text)}${n.source?` <span class="dim small">(${esc(n.source)})</span>`:''}</span><button class="k small" data-act="delnote" data-id="${n.id}" aria-label="Delete">x</button></div>`).join(''):'<p class="dim small">none yet. the three things you note at the end of each page land here.</p>'}
  </section>
  <hr class="rule">
  <section class="blk"><div class="lbl">Interests and their pieces · ${anchors.length}</div>
    <p class="dim small">each piece can turn up as the kept card. tap an interest to edit its pieces.</p>
    ${ed?`<div class="hl wrap">${esc(ed.name)}</div>
      <label class="line"><textarea id="e-bits" rows="4" aria-label="Pieces, one per line">${esc(bitsOf(ed).join('\n'))}</textarea></label>
      <p class="dim small">one piece per line.</p>
      <div class="opts"><button class="k" data-act="savebits">save</button><button class="k" data-act="cancel">cancel</button><button class="k" data-act="delint">${S.armDelete?'sure? delete':'delete interest'}</button></div>`:''}
    ${anchors.map(a=>`<button class="entry" data-act="edit" data-id="${a.id}"><span class="nm wrap">${esc(a.name)}</span><span class="m">${bitsOf(a).length} pieces</span></button>`).join('')}
    <div class="opts"><label class="line" style="flex:1"><input id="i-new" placeholder="new interest" autocomplete="off" aria-label="New interest"></label><button class="k" data-act="addint">add</button></div>
  </section>`;
}

function viewWays(){
  const ws=of('way').sort((a,b)=>a.name.localeCompare(b.name));
  const ed=S.editing&&S.items.find(x=>x.id===S.editing&&x.list==='way');
  return `
  <section class="blk"><div class="lbl">${ed?'Edit a way':'Add a way'}</div>
    <p class="dim small">a way says how to work, never what it means. borrow from artists you like.</p>
    <label class="line big"><input id="w-name" value="${esc(ed?ed.name:'')}" placeholder="erase" autocomplete="off" aria-label="Name"></label>
    <label class="line"><textarea id="w-text" rows="1" aria-label="Instruction" placeholder="copy the found text out, then cover all but a few words.">${esc(ed?ed.text:'')}</textarea></label>
    <label class="line"><input id="w-after" value="${esc(ed&&ed.after||'')}" placeholder="after (optional): Tom Phillips, A Humument" autocomplete="off" aria-label="After"></label>
    <div class="opts"><button class="k" data-act="saveway">${ed?'save changes':'add way'}</button>${ed?`<button class="k" data-act="cancel">cancel</button><button class="k" data-act="delway">${S.armDelete?'sure? delete':'delete'}</button>`:''}</div></section>
  <hr class="rule">
  <section class="blk"><div class="lbl">Ways · ${ws.length}</div>
    ${ws.map(w=>{const r=retired(w),m=mehs(w.id);return `<button class="entry" data-act="editway" data-id="${w.id}"><span class="nm wrap">${esc(w.name)}${r?' <span class="dim">(retired)</span>':''}</span><span class="m wrap">${esc(w.text||'')}${w.after?' · after '+esc(w.after):''}${m?` · meh ×${m}`:''}</span></button>${r?`<div style="padding-left:2ch"><button class="k small" data-act="revive" data-id="${w.id}">bring it back</button></div>`:''}`}).join('')}
  </section>`;
}

function render(keep){
  const a=document.activeElement, id=a&&a.id, pos=a&&a.selectionStart;
  ['n-0','n-1','n-2'].forEach((x,i)=>{const n=document.getElementById(x); if(n) S.notes[i]=n.value});
  const v={today:viewToday,kept:viewKept,ways:viewWays}[S.tab]||viewToday;
  term.innerHTML=header()+v();
  document.querySelectorAll('.line textarea').forEach(t=>{t.style.height='auto';t.style.height=t.scrollHeight+'px'});
  if(keep&&id){const n=document.getElementById(id); if(n){n.focus(); try{n.setSelectionRange(pos,pos)}catch(_){}}}
}

document.addEventListener('input',e=>{if(e.target.tagName==='TEXTAREA'){e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px'}});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter') return; const id=e.target.id||'';
  if(id==='k-new'){e.preventDefault(); addNote()}
  else if(id==='i-new'){e.preventDefault(); addInterest()}
  else if(/^n-[01]$/.test(id)){e.preventDefault(); const n=document.getElementById('n-'+(+id[2]+1)); if(n) n.focus()}
});
async function addNote(){
  const i=$('#k-new'), v=(i&&i.value||'').trim(); if(!v) return;
  await putItem({id:uid(),list:'note',text:v,date:today(),created:Date.now()}); say('kept.');
}
async function addInterest(){
  const i=$('#i-new'), v=(i&&i.value||'').trim(); if(!v) return;
  const it={id:uid(),list:'anchor',name:v,bits:[],created:Date.now(),updated:Date.now()};
  await putItem(it); S.editing=it.id; say('added '+v+'. now give it some pieces.');
}

document.addEventListener('click',async e=>{
  const tb=e.target.closest('[data-tab]');
  if(tb){S.tab=tb.dataset.tab; S.editing=null; S.armDelete=false; S.armRedraw=false; render(); window.scrollTo(0,0); return}
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  const act=b.dataset.act, v=b.dataset.v, k=today(), h=page(k);
  if(act!=='redraw') S.armRedraw=false;
  if(!['delint','delway'].includes(act)) S.armDelete=false;
  switch(act){
    case 'pal': setPal(PALS[(PALS.indexOf(pal)+1)%PALS.length]); render(); break;
    case 'open': if(h){render();break} S.hist[k]=makePage(k); render(); putHist(k); break;
    case 'redraw': if(!S.armRedraw){S.armRedraw=true;render();break}
      {const p=makePage(k); p.notes=(h&&h.notes)||[]; p.redraws=((h&&h.redraws)||0)+1; S.hist[k]=p; S.armRedraw=false; render(); putHist(k); window.scrollTo(0,0)} break;
    case 'again-found': if(!h) break; {const f=pickFound(h.found&&h.found.text); if(f){h.found=f; render(true); putHist(k)}} break;
    case 'again-kept': if(!h) break; {const x=pickKept(k,h.kept&&h.kept.text); if(x){h.kept=x; render(true); putHist(k)}} break;
    case 'again-way': if(!h) break; {const w=pickWay(k,h.way); if(w){setWay(h,w); render(true); putHist(k)}} break;
    case 'keepway': {const w=wayOf(h); if(!w||!w.fresh) break; const id=uid(); await putItem({id,list:'way',name:w.name,text:w.text,after:w.after||'',url:w.url||'',created:Date.now()}); h.way=id; delete h.wayObj; putHist(k); say('kept. it\'s in your ways now.')} break;
    case 'notes': {if(!h) break; render(); const n=S.notes.map(x=>x.trim()).filter(Boolean); if(!n.length){say('write at least one.');break}
      h.notes=n; S.notes=['','','']; for(const t of n) await putItem({id:uid(),list:'note',text:t,date:k,created:Date.now()});
      render(); putHist(k); say(n.length+' kept for another day.'); break}
    case 'rate': {if(!h) break; const r=+v, was=h.rating; h.rating=r;
      if(r===3&&h.found&&!h.foundKept){h.foundKept=true; await putItem({id:uid(),list:'note',text:h.found.text,source:h.found.source,date:k,created:Date.now()})}
      render(); putHist(k); say(r===3?'loved. the found line is now in kept.':r===1?'noted. this way is closer to retiring.':'noted.'); break}
    case 'old': S.oldOpen=v||null; render(); break;
    case 'addnote': addNote(); break;
    case 'delnote': await dropItem(b.dataset.id); render(); break;
    case 'addint': addInterest(); break;
    case 'edit': S.editing=b.dataset.id; render(); window.scrollTo(0,0); break;
    case 'cancel': S.editing=null; render(); break;
    case 'savebits': {const it=S.items.find(x=>x.id===S.editing); if(!it) break; const t=$('#e-bits');
      const n=Object.assign({},it,{bits:String(t&&t.value||'').split('\n').map(x=>x.trim()).filter(Boolean),updated:Date.now()});
      await putItem(n); S.editing=null; say('saved '+n.name+'.'); break}
    case 'delint': if(!S.armDelete){S.armDelete=true;render();break} {const n=nm(S.editing); await dropItem(S.editing); S.editing=null; S.armDelete=false; say('deleted '+n+'.')} break;
    case 'editway': S.editing=b.dataset.id; render(); window.scrollTo(0,0); break;
    case 'saveway': {const nmv=($('#w-name').value||'').trim(), tx=($('#w-text').value||'').trim(), af=($('#w-after').value||'').trim(); if(!nmv){say('give it a name.');break}
      const old=S.editing&&S.items.find(x=>x.id===S.editing);
      await putItem(Object.assign({},old||{id:uid(),list:'way',created:Date.now()},{name:nmv,text:tx,after:af,updated:Date.now()}));
      S.editing=null; say((old?'updated ':'added ')+nmv+'.'); break}
    case 'delway': if(!S.armDelete){S.armDelete=true;render();break} {const n=nm(S.editing); await dropItem(S.editing); S.editing=null; S.armDelete=false; say('deleted '+n+'.')} break;
    case 'backup': {const blob=new Blob([JSON.stringify({items:S.items,hist:S.hist},null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='daily-page-'+today()+'.json';document.body.appendChild(a);a.click();a.parentNode.removeChild(a);say('backup saved to your downloads.')} break;
    case 'restore': {const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=async()=>{try{const d=JSON.parse(await i.files[0].text()); if(!Array.isArray(d.items)) throw 0; S.items=d.items;S.hist=d.hist||{};saveLocal();say('restored.')}catch(e){say("that file isn't a daily page backup.")}};i.click()} break;
    case 'revive': {const w=S.items.find(x=>x.id===b.dataset.id); if(w){await putItem(Object.assign({},w,{keep:true})); say(w.name+' is back.')}} break;
  }
});

render();
connect();
})();
</script>

</body></html>

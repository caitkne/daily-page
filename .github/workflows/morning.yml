name: morning
on:
  schedule:
    - cron: "0 16 * * *"   # 5am in New Zealand during daylight time, 4am otherwise
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch.py
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      - name: Save today's cards
        run: |
          git config user.name "daily-page bot"
          git config user.email "actions@users.noreply.github.com"
          git add found
          git diff --cached --quiet || git commit -m "found: $(date -u +%F)"
          git pull --rebase
          git push

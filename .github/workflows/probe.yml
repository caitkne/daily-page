name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "== LTLYM"; curl -sL -A "Mozilla/5.0" http://www.learningtoloveyoumore.com/assignments/index.php -o a.html; wc -c a.html
          python3 -c "
          import re,html
          s=open('a.html',encoding='latin-1').read()
          for m in re.findall(r'(?is)<a[^>]+href=\"([^\"]*assignments/[^\"]+)\"[^>]*>(.*?)</a>',s)[:120]: print(m[0],'::',re.sub(r'<[^>]+>|\s+',' ',html.unescape(m[1])).strip())
          "
          echo "== JUNTO"; curl -sL -A "Mozilla/5.0" "https://disquiet.com/category/junto/feed/" -o j.xml; wc -c j.xml
          python3 -c "
          import re,html
          s=open('j.xml',encoding='utf-8',errors='replace').read()
          for t,d in re.findall(r'(?s)<item>.*?<title>(.*?)</title>.*?<description>(.*?)</description>',s)[:5]: print('T',html.unescape(t)); print('D',re.sub(r'<[^>]+>','',html.unescape(d.replace('<![CDATA[','').replace(']]>','')))[:400])
          "

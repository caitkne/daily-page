name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sL -A "Mozilla/5.0" https://www.berlinale.de/en/2026/programme/202611958.html > p.html
          python3 - <<'PY'
          import re,html
          s=open('p.html',encoding='utf-8',errors='replace').read()
          for m in re.finditer(r'(?is)<(p|div)([^>]*)>([^<]{80,900})<',s):
              print(m.group(1),m.group(2)[:80],'::',re.sub(r'\s+',' ',html.unescape(m.group(3)))[:200])
          PY

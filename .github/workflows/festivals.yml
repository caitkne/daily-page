name: festivals
on:
  schedule:
    - cron: "0 15 1 * *"   # once a month
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python collect_festivals.py
      - name: Save synopses
        run: |
          git config user.name "daily-page bot"
          git config user.email "actions@users.noreply.github.com"
          git add festivals.json
          git diff --cached --quiet || git commit -m "festivals: $(date -u +%F)"
          git pull --rebase
          git push
